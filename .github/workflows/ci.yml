name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Regenerate sample data and database
        run: python -m productpulse.pipeline --rebuild
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Test and dashboard smoke checks
        run: python -m pytest
