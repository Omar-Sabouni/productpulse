[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "productpulse"
version = "0.1.0"
description = "A local product analytics dashboard backed by DuckDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.5,<7",
    "duckdb>=1.1,<2",
    "pandas>=2.1,<3",
    "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
